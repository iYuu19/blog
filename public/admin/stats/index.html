<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>访问统计 | iYuu Notes 后台</title>
    <style>
      :root {
        --bg: #f4f1eb;
        --card: rgba(255, 253, 249, 0.92);
        --text: #242033;
        --muted: #756b61;
        --line: rgba(221, 180, 107, 0.56);
        --accent: #d95d47;
        --accent-2: #1f7a72;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 217, 121, 0.22), transparent 24%),
          radial-gradient(circle at 82% 18%, rgba(126, 215, 248, 0.18), transparent 24%),
          var(--bg);
        color: var(--text);
        font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
        line-height: 1.7;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(1040px, calc(100vw - 32px));
        margin: 0 auto;
      }

      header {
        padding: 32px 0 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 10px;
      }

      .brand {
        display: grid;
        gap: 4px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: clamp(2rem, 4vw, 3.4rem);
      }

      .muted {
        color: var(--muted);
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 253, 249, 0.86);
        color: var(--accent);
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      main {
        padding: 18px 0 56px;
      }

      .card {
        border: 2px solid var(--line);
        border-radius: 28px 22px 24px 30px;
        background: var(--card);
        box-shadow: 0 16px 28px rgba(131, 102, 60, 0.08);
      }

      .setup-card {
        padding: 22px;
        margin-bottom: 18px;
      }

      .owner-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .owner-copy {
        display: grid;
        gap: 4px;
      }

      .owner-copy p {
        margin: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .metric {
        padding: 18px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-family: "JetBrains Mono", Consolas, monospace;
        font-size: clamp(1.8rem, 4vw, 2.7rem);
        line-height: 1.1;
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.9fr);
        gap: 18px;
        margin-top: 18px;
      }

      .panel {
        padding: 22px;
      }

      .panel--wide {
        grid-column: 1 / -1;
      }

      .panel h2 {
        margin: 0 0 14px;
        font-family: "Noto Serif SC", "Songti SC", serif;
        font-size: 1.35rem;
      }

      .rows {
        display: grid;
        gap: 10px;
      }

      .row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px dashed rgba(221, 180, 107, 0.44);
      }

      .row:last-child {
        border-bottom: 0;
      }

      .row-title {
        min-width: 0;
      }

      .row-title strong,
      .row-title small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row-title small {
        color: var(--muted);
      }

      .article-meta,
      .visitor-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .visitor-meta span,
      .article-meta span {
        min-width: 0;
      }

      .visitor-paths {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .visitor-paths span {
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        vertical-align: bottom;
        white-space: nowrap;
      }

      .sparkline {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        align-items: end;
        gap: 4px;
        width: min(260px, 100%);
        height: 24px;
        margin-top: 8px;
      }

      .sparkline span {
        min-height: 4px;
        border-radius: 999px 999px 2px 2px;
        background: linear-gradient(180deg, #5cb9e6, #ffd56c, #e85c4a);
      }

      .count {
        min-width: 56px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 234, 227, 0.92);
        color: var(--accent);
        font-weight: 900;
        text-align: center;
      }

      .bars {
        display: grid;
        gap: 12px;
      }

      .bar {
        display: grid;
        gap: 6px;
      }

      .bar-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .bar-track {
        overflow: hidden;
        height: 12px;
        border-radius: 999px;
        background: rgba(221, 180, 107, 0.22);
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #e85c4a, #ffd56c, #5cb9e6);
      }

      .token-form {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }

      input {
        flex: 1 1 260px;
        min-height: 42px;
        padding: 0 14px;
        border: 2px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 253, 249, 0.9);
        color: var(--text);
        font: inherit;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 820px) {
        .topbar,
        .panels {
          grid-template-columns: 1fr;
          display: grid;
        }

        .owner-card {
          align-items: stretch;
          display: grid;
        }

        .panel--wide {
          grid-column: auto;
        }

        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .row {
          grid-template-columns: 1fr;
        }

        .count {
          width: max-content;
        }
      }
    </style>
  </head>
  <body>
    <header class="shell">
      <div class="topbar">
        <div class="brand">
          <p class="eyebrow">Admin Analytics</p>
          <h1>访问统计</h1>
          <p class="muted">这里显示博客页面浏览、今日访客、匿名访客明细和热门文章。</p>
        </div>
        <div class="top-actions">
          <button class="button" type="button" id="refresh-stats">刷新统计</button>
          <a class="button" href="/admin/">返回后台</a>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="card setup-card" id="status-card">
        <strong id="status-title">正在读取统计...</strong>
        <p class="muted" id="status-text">如果这是首次部署，请先在 Cloudflare Pages 绑定 KV 命名空间。</p>
        <form class="token-form" id="token-form" hidden>
          <input id="token-input" type="password" autocomplete="current-password" placeholder="输入 ANALYTICS_ADMIN_TOKEN" />
          <button class="button" type="submit">查看统计</button>
        </form>
      </section>

      <section class="grid" id="metrics" hidden>
        <article class="card metric">
          <span>总浏览量</span>
          <strong data-metric="totalViews">0</strong>
        </article>
        <article class="card metric">
          <span>今日浏览</span>
          <strong data-metric="todayViews">0</strong>
        </article>
        <article class="card metric">
          <span>今日访客</span>
          <strong data-metric="todayVisitors">0</strong>
        </article>
        <article class="card metric">
          <span>最近记录</span>
          <strong data-metric="lastSeen">--</strong>
        </article>
      </section>

      <section class="card setup-card owner-card" id="owner-card" hidden>
        <div class="owner-copy">
          <strong id="owner-tracking-title">本机访问会计入统计</strong>
          <p class="muted" id="owner-tracking-text">开启排除后，这个浏览器访问博客不会增加浏览量。</p>
        </div>
        <button class="button" type="button" id="owner-tracking-toggle">排除本机访问</button>
      </section>

      <section class="panels" id="panels" hidden>
        <article class="card panel">
          <h2>文章浏览排行</h2>
          <div class="rows" id="article-pages"></div>
        </article>

        <aside class="card panel">
          <h2>最近 7 天</h2>
          <div class="bars" id="recent-days"></div>
          <h2 style="margin-top: 24px">今日热门文章</h2>
          <div class="rows" id="today-article-pages"></div>
          <h2 style="margin-top: 24px">今日搜索词</h2>
          <div class="rows" id="today-search-terms"></div>
          <h2 style="margin-top: 24px">今日来源</h2>
          <div class="rows" id="referrers"></div>
        </aside>

        <article class="card panel panel--wide">
          <h2>今日匿名访客</h2>
          <div class="rows" id="today-visitors"></div>
        </article>

        <article class="card panel panel--wide">
          <h2>最近匿名访客</h2>
          <div class="rows" id="recent-visitors"></div>
        </article>

        <article class="card panel panel--wide">
          <h2>热门页面</h2>
          <div class="rows" id="top-pages"></div>
        </article>

        <article class="card panel panel--wide">
          <h2>搜索词排行</h2>
          <div class="rows" id="search-terms"></div>
        </article>
      </section>
    </main>

    <script>
      const tokenKey = "iyuu-analytics-token";
      const ignoreTrackingKey = "iyuu-analytics-ignore";
      const statusTitle = document.getElementById("status-title");
      const statusText = document.getElementById("status-text");
      const tokenForm = document.getElementById("token-form");
      const tokenInput = document.getElementById("token-input");
      const metrics = document.getElementById("metrics");
      const panels = document.getElementById("panels");
      const refreshStatsButton = document.getElementById("refresh-stats");
      const ownerCard = document.getElementById("owner-card");
      const ownerTrackingTitle = document.getElementById("owner-tracking-title");
      const ownerTrackingText = document.getElementById("owner-tracking-text");
      const ownerTrackingToggle = document.getElementById("owner-tracking-toggle");

      function formatNumber(value) {
        return new Intl.NumberFormat("zh-CN").format(value || 0);
      }

      function formatDate(value) {
        if (!value) return "--";
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date(value));
      }

      function setMetric(name, value) {
        const node = document.querySelector(`[data-metric="${name}"]`);
        if (node) node.textContent = value;
      }

      function isOwnerTrackingIgnored() {
        return localStorage.getItem(ignoreTrackingKey) === "true";
      }

      function updateOwnerTrackingUi() {
        const ignored = isOwnerTrackingIgnored();
        ownerTrackingTitle.textContent = ignored ? "本机访问已排除" : "本机访问会计入统计";
        ownerTrackingText.textContent = ignored
          ? "你用这个浏览器看博客时，不会再增加浏览量。"
          : "开启排除后，这个浏览器访问博客不会增加浏览量。";
        ownerTrackingToggle.textContent = ignored ? "恢复计入" : "排除本机访问";
      }

      function renderRows(container, rows, emptyText) {
        container.innerHTML = "";
        if (!rows.length) {
          container.innerHTML = `<p class="muted">${emptyText}</p>`;
          return;
        }

        for (const item of rows) {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `
            <div class="row-title">
              <strong></strong>
              <small></small>
            </div>
            <span class="count"></span>
          `;
          row.querySelector("strong").textContent = item.title || item.name || item.path;
          row.querySelector("small").textContent = item.path || item.name || "";
          row.querySelector(".count").textContent = formatNumber(item.views);
          container.appendChild(row);
        }
      }

      function renderArticleRows(container, rows, emptyText) {
        container.innerHTML = "";
        if (!rows.length) {
          container.innerHTML = `<p class="muted">${emptyText}</p>`;
          return;
        }

        for (const item of rows) {
          const row = document.createElement("div");
          const recentDays = item.recentDays || [];
          const maxRecentViews = Math.max(1, ...recentDays.map((day) => day.views || 0));
          row.className = "row";
          row.innerHTML = `
            <div class="row-title">
              <strong></strong>
              <small></small>
              <div class="article-meta">
                <span data-meta="today"></span>
                <span data-meta="recent"></span>
                <span data-meta="last"></span>
              </div>
              <div class="sparkline" aria-hidden="true"></div>
            </div>
            <span class="count"></span>
          `;
          row.querySelector("strong").textContent = item.title || item.path;
          row.querySelector("small").textContent = item.path || "";
          row.querySelector(".count").textContent = formatNumber(item.views);
          row.querySelector('[data-meta="today"]').textContent = `今日 ${formatNumber(item.todayViews)} PV`;
          row.querySelector('[data-meta="recent"]').textContent = `近 7 天 ${formatNumber(item.recentViews)} PV`;
          row.querySelector('[data-meta="last"]').textContent = `最近 ${formatDate(item.lastSeen)}`;

          const sparkline = row.querySelector(".sparkline");
          for (const day of recentDays) {
            const bar = document.createElement("span");
            bar.title = `${day.date}: ${formatNumber(day.views)} PV`;
            bar.style.height = `${Math.max(4, ((day.views || 0) / maxRecentViews) * 24)}px`;
            sparkline.appendChild(bar);
          }

          container.appendChild(row);
        }
      }

      function formatLocation(profile = {}) {
        const parts = [profile.country, profile.region, profile.city].filter((item) => item && item !== "unknown");
        return parts.length ? parts.join(" / ") : "未知地区";
      }

      function formatVisitorTech(profile = {}) {
        return [profile.device, profile.os, profile.browser].filter((item) => item && item !== "unknown").join(" · ") || "未知设备";
      }

      function renderVisitorRows(container, rows, emptyText) {
        container.innerHTML = "";
        if (!rows.length) {
          container.innerHTML = `<p class="muted">${emptyText}</p>`;
          return;
        }

        for (const visitor of rows) {
          const row = document.createElement("div");
          const paths = visitor.topPaths || [];
          const referrers = visitor.topReferrers || [];
          const profile = visitor.profile || {};
          row.className = "row";
          row.innerHTML = `
            <div class="row-title">
              <strong></strong>
              <small></small>
              <div class="visitor-meta">
                <span data-meta="location"></span>
                <span data-meta="tech"></span>
                <span data-meta="referrer"></span>
                <span data-meta="first"></span>
              </div>
              <div class="visitor-paths"></div>
            </div>
            <span class="count"></span>
          `;

          row.querySelector("strong").textContent = `访客 ${visitor.id}`;
          row.querySelector("small").textContent = `最近访问 ${formatDate(visitor.lastSeen)}`;
          row.querySelector('[data-meta="location"]').textContent = formatLocation(profile);
          row.querySelector('[data-meta="tech"]').textContent = formatVisitorTech(profile);
          row.querySelector('[data-meta="referrer"]').textContent = `来源 ${referrers[0]?.name || "direct"}`;
          row.querySelector('[data-meta="first"]').textContent = `首次 ${formatDate(visitor.firstSeen)}`;
          row.querySelector(".count").textContent = `${formatNumber(visitor.views)} PV`;

          const pathText = paths.length
            ? paths.map((path) => `${path.title || path.path} (${formatNumber(path.views)})`).join(" / ")
            : "暂无页面记录";
          const pathNode = document.createElement("span");
          pathNode.textContent = pathText;
          row.querySelector(".visitor-paths").appendChild(pathNode);
          container.appendChild(row);
        }
      }

      function renderRecentDays(days) {
        const container = document.getElementById("recent-days");
        const max = Math.max(1, ...days.map((day) => day.views));
        container.innerHTML = "";

        for (const day of days) {
          const row = document.createElement("div");
          row.className = "bar";
          row.innerHTML = `
            <div class="bar-label">
              <span></span>
              <span></span>
            </div>
            <div class="bar-track"><div class="bar-fill"></div></div>
          `;
          row.querySelector(".bar-label span:first-child").textContent = day.date.slice(5);
          row.querySelector(".bar-label span:last-child").textContent = `${formatNumber(day.views)} PV / ${formatNumber(day.visitors)} UV`;
          row.querySelector(".bar-fill").style.width = `${Math.max(4, (day.views / max) * 100)}%`;
          container.appendChild(row);
        }
      }

      async function loadStats(token = localStorage.getItem(tokenKey) || "") {
        refreshStatsButton.disabled = true;
        statusTitle.textContent = "正在读取统计...";
        statusText.textContent = "正在连接 /api/stats。";
        tokenForm.hidden = true;

        try {
          const headers = token ? { Authorization: `Bearer ${token}` } : {};
          const response = await fetch("/api/stats", { headers, cache: "no-store" });
          const data = await response.json().catch(() => ({}));

          if (response.status === 401) {
            statusTitle.textContent = "需要后台统计 token";
            statusText.textContent = "请输入 Cloudflare Pages 环境变量 ANALYTICS_ADMIN_TOKEN 的值。";
            tokenForm.hidden = false;
            tokenInput.focus();
            return;
          }

          if (!response.ok) {
            statusTitle.textContent = "统计暂时不可用";
            statusText.textContent = data.message || "请检查 Cloudflare Pages Functions 和 KV 绑定。";
            return;
          }

          if (token) {
            localStorage.setItem(tokenKey, token);
          }

          statusTitle.textContent = data.protected ? "统计已启用访问保护" : "统计已启用";
          statusText.textContent = data.protected
            ? "当前统计接口需要 token，适合放在后台查看。"
            : "已启用 60 秒同页面去重；可设置 ANALYTICS_ADMIN_TOKEN 环境变量给统计接口加锁。";

          setMetric("totalViews", formatNumber(data.summary.totalViews));
          setMetric("todayViews", formatNumber(data.today.views));
          setMetric("todayVisitors", formatNumber(data.today.visitors));
          setMetric("lastSeen", formatDate(data.summary.lastSeen));

          renderArticleRows(document.getElementById("article-pages"), data.articlePages || [], "还没有文章浏览记录。");
          renderRows(document.getElementById("today-article-pages"), data.today.articlePages || [], "今天还没有文章浏览记录。");
          renderRows(document.getElementById("today-search-terms"), data.today.searchTerms || [], "今天还没有搜索记录。");
          renderRows(document.getElementById("top-pages"), data.topPages || [], "还没有页面浏览记录。");
          renderRows(document.getElementById("search-terms"), data.searchTerms || [], "还没有搜索词记录。");
          renderRows(document.getElementById("referrers"), data.today.referrers || [], "今天还没有来源记录。");
          renderVisitorRows(document.getElementById("today-visitors"), data.today.visitorDetails || [], "今天还没有可展示的匿名访客。");
          renderVisitorRows(document.getElementById("recent-visitors"), data.recentVisitors || [], "还没有可展示的匿名访客。");
          renderRecentDays(data.recentDays || []);

          updateOwnerTrackingUi();
          metrics.hidden = false;
          ownerCard.hidden = false;
          panels.hidden = false;
        } finally {
          refreshStatsButton.disabled = false;
        }
      }

      tokenForm.addEventListener("submit", (event) => {
        event.preventDefault();
        loadStats(tokenInput.value.trim());
      });

      ownerTrackingToggle.addEventListener("click", () => {
        localStorage.setItem(ignoreTrackingKey, String(!isOwnerTrackingIgnored()));
        updateOwnerTrackingUi();
      });

      refreshStatsButton.addEventListener("click", () => {
        loadStats().catch((error) => {
          statusTitle.textContent = "统计读取失败";
          statusText.textContent = error.message || "未知错误";
        });
      });

      loadStats().catch((error) => {
        statusTitle.textContent = "统计读取失败";
        statusText.textContent = error.message || "未知错误";
      });
    </script>
  </body>
</html>
